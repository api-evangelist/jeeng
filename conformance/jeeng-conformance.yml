- id: oauth2
  conforms: true
  evidence: RFC 6749 client-credentials grant against the Microsoft Entra ID v2.0 token endpoint;
    `grant_type=client_credentials`, form-encoded client_id/client_secret/scope, Bearer token in the
    Authorization header. Documented at
    https://developers.jeeng.com/reference/getting-an-access-token.
- id: oidc
  conforms: partial
  evidence: The identity provider (Microsoft Entra ID, tenant revenuestripe.onmicrosoft.com) serves
    a full OpenID Connect discovery document (probed 200 on 2026-08-12), but Jeeng uses only the
    machine-to-machine token flow — no id_token, no user authentication, and Jeeng itself serves no
    /.well-known/openid-configuration.
- id: odata
  version: '4.0'
  conforms: true
  evidence: 'The campaigns report states "The query and response are OData V4 format." Four
    reporting operations require an OData `$filter` expression, and the response may include a
    `next` link.'
- id: rfc9457
  conforms: false
  evidence: Errors are returned as the Azure API Management envelope
    `{"statusCode":..,"message":..}` with content-type application/json, not
