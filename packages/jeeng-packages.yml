summary: Jeeng ships no client library for the Email Monetization APIs. The developer hub documents
  raw HTTP only — a form-encoded token request to Microsoft Entra ID and Bearer-token calls to
  powerinbox.azure-api.net — and names no SDK in any language. No SDKs pointer is wired in apis.yml
  because no first-party client library for these APIs exists.
