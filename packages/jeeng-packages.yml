integration_distribution:
  note: Publisher integration is not distributed as a package at all. It is done with merge tags,
    per-newsletter ad tags, `cs_email` tracking parameters and a direct Google Ad Manager
    integration, all configured through the portal with an account manager — there is nothing to
    install and therefore nothing to version.
