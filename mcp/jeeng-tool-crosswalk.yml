notes:
- >-
  Binding the documentation MCP's tools to REST operations would be a category error: they serve
  markdown pages, not campaign or reporting data. No confidence level would make such a row honest.
- If Jeeng later publishes an API-facing MCP server, the ten operations above are the surface it
  would wrap, and the parameters in the OpenAPI fragments are the inputSchemas those tools would
  inherit.
