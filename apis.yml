aid: jeeng
name: Jeeng
description: >-
  Jeeng (formerly PowerInbox, acquired by OpenWeb in 2022 and now marketed as OpenWeb
  Email Monetization) is a multichannel monetization and audience-engagement platform for digital
  publishers. It helps publishers grow first-party, opt-in audiences and generate advertising
  revenue across email newsletters, websites, push notifications, and newsreader apps, reaching
  more than 150M opt-in subscribers. Its products — AdFill, AdServe, AdMarket, and Renderer — fill
  vacant ad inventory with monetized content, extend direct ad campaigns into email through
  existing ad servers, connect advertisers to opt-in audiences, and streamline Google Ad Manager
  ad-ops workflows. Publisher integration is handled through merge tags, per-newsletter ad tags,
  and cs_email tracking parameters plus direct Google Ad Manager integration; campaigns and
  reporting are managed through the portal at manage.jeeng.com. Jeeng also publishes partner
  Reporting & Management APIs at developers.jeeng.com — an advertiser API for campaign line and
  creative management plus campaign/performance reporting, and a publisher API for container,
  placement and publisher performance reporting — served from powerinbox.azure-api.net behind
  Microsoft Entra ID OAuth 2.0 client-credentials tokens. API access is not self-serve: an account
  manager provisions the client id and client secret.
