    url: https://developers.jeeng.com/docs/publisher-overview
  - type: APIReference
    url: https://developers.jeeng.com/reference
  - type: OpenAPI
    url: openapi/jeeng-publishers-openapi.yml
  - type: Overlay
    url: overlays/jeeng-publishers-overlay.yaml
- name: Jeeng Email Monetization — Authentication
  description: >-
    OAuth 2.0 client-credentials token endpoint for the Jeeng / OpenWeb Email Monetization partner
    APIs, published by Jeeng as its own OpenAPI definition. Tokens are issued by the Microsoft
    Entra ID (Azure AD) tenant revenuestripe.onmicrosoft.com and must be requested with the scope
    api://revenuestripe.onmicrosoft.com/partners/.default, which grants access to every partner
    endpoint. The resulting access_token is sent as a bearer token to the advertiser and publisher
    APIs.
  humanURL: https://developers.jeeng.com/reference/getting-an-access-token
  baseURL: https://login.microsoftonline.com/revenuestripe.onmicrosoft.com
