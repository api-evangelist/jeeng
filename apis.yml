apis:
- name: Jeeng Email Monetization — Advertisers API
  description: >-
    Advertiser-side campaign management and reporting for the Jeeng / OpenWeb Email Monetization
    platform. Update campaign lines (daily spend goal and CPC/CPM/CPA pricing), transition campaign
    line and creative status between running, paused and archived, and pull campaign and
    campaign-line reports at daily or hourly grain using OData V4 $filter queries. A flexible
    advertiser performance report returns a 303 redirect to a CSV download for a caller-specified
    set of fields, filters and groupings over a date range of up to 32 days. Requires an OAuth 2.0
    client-credentials bearer token from the Microsoft Entra tenant, requested with the partners
    scope; credentials are provisioned by an account manager.
  humanURL: https://developers.jeeng.com/reference
  baseURL: https://powerinbox.azure-api.net/
  tags:
  - Advertising
  - AdTech
  - Email
  - Reporting
  - Analytics
  - OData
  - Campaign Management
  properties:
  - type: Documentation
    url: https://developers.jeeng.com/docs/advertiser-overview
  - type: APIReference
    url: https://developers.jeeng.com/reference
  - type: OpenAPI
    url: openapi/jeeng-advertisers-openapi.yml
  - type: Overlay
    url: overlays/jeeng-advertisers-overlay.yaml
- name: Jeeng Email Monetization — Publishers API
  description: >-
    Publisher-side inventory reporting for the Jeeng / OpenWeb Email Monetization platform.
    Retrieve container and placement reports at a daily grain using OData V4 $filter queries, and a
    flexible publisher performance report that returns a 303 redirect to a CSV download for a
    caller-specified set of fields, filters and groupings over a date range of up to 32 days.
    Metrics cover served ads, opens (including Apple Mail Privacy Protection adjusted opens),
    clicks, revenue, CTR and RPM. Requires an OAuth 2.0 client-credentials bearer token from the
    Microsoft Entra tenant, requested with the partners scope; credentials are provisioned by an
    account manager.
  humanURL: https://developers.jeeng.com/reference
  baseURL: https://powerinbox.azure-api.net/
  tags:
  - Publishing
  - AdTech
  - Email
  - Newsletters
  - Reporting
  - Analytics
  - OData
  properties:
